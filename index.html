<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>员工性格测评</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f2f6fd;
            font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 36px;
            padding: 40px 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 20, 40, 0.10);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .header .title {
            font-size: 22px;
            font-weight: 700;
            color: #0b1e33;
            letter-spacing: 0.3px;
        }
        .header .badge {
            background: #eaf1fd;
            color: #1f4e8c;
            font-weight: 600;
            font-size: 15px;
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid #c5d9f0;
        }
        .progress-wrap {
            background: #e9eff7;
            border-radius: 40px;
            height: 8px;
            margin: 10px 0 22px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2a6bb0;
            border-radius: 40px;
            transition: width 0.35s ease;
        }

        /* 基本信息样式 */
        .info-section {
            background: #f8fbff;
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 24px;
            border: 2px solid #dce8f5;
        }
        .info-section h3 {
            font-size: 17px;
            color: #1f3a5f;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-section h3 span {
            background: #1f4e8c;
            color: white;
            font-size: 13px;
            border-radius: 30px;
            padding: 0 14px;
            line-height: 26px;
        }
        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 20px;
        }
        .info-group {
            flex: 1 0 180px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-group label {
            font-size: 14px;
            font-weight: 600;
            color: #1a314b;
        }
        .info-group label .required {
            color: #c0392b;
            margin-left: 2px;
        }
        .info-group input,
        .info-group select {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid #d5e0ed;
            font-size: 15px;
            background: white;
            transition: 0.15s;
            outline: none;
            font-family: inherit;
        }
        .info-group input:focus,
        .info-group select:focus {
            border-color: #2a6bb0;
            box-shadow: 0 0 0 3px rgba(42, 107, 176, 0.12);
        }
        .info-group input:disabled,
        .info-group select:disabled {
            background: #f0f4fa;
            color: #4a5f7a;
            cursor: not-allowed;
        }
        .info-error {
            color: #c0392b;
            font-size: 13px;
            margin-top: 2px;
            display: none;
        }

        /* 问卷样式 */
        .question-area {
            padding: 10px 0 10px;
        }
        .q-number {
            font-size: 15px;
            font-weight: 500;
            color: #4b6f93;
            margin-bottom: 6px;
        }
        .q-text {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.6;
            color: #102a44;
            padding: 8px 0 16px;
        }
        .reverse-tag {
            display: inline-block;
            background: #f0eaf8;
            color: #6f4f8a;
            font-size: 13px;
            font-weight: 500;
            padding: 2px 16px;
            border-radius: 30px;
            margin-left: 10px;
            border: 1px solid #d6c7e8;
        }
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 14px;
            margin: 20px 0 10px;
            justify-content: center;
        }
        .options-grid label {
            flex: 1 0 52px;
            min-width: 60px;
            background: #f7faff;
            border: 2px solid #dde6f2;
            border-radius: 60px;
            padding: 14px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 17px;
            color: #1d3a5a;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .options-grid label span.sub {
            font-weight: 400;
            font-size: 12px;
            color: #5d7b9b;
        }
        .options-grid input[type="radio"] {
            display: none;
        }
        .options-grid label:has(input:checked) {
            background: #dce8fa;
            border-color: #2a6bb0;
            box-shadow: 0 4px 10px rgba(42, 107, 176, 0.15);
            transform: scale(1.01);
        }
        .options-grid label:hover:not(.disabled) {
            background: #e7effb;
            border-color: #8eb1d9;
        }
        .options-grid label.disabled {
            opacity: 0.7;
            cursor: default;
            background: #f1f5fa;
            border-color: #ccd8e8;
        }
        .options-grid label.disabled:hover {
            background: #f1f5fa;
            border-color: #ccd8e8;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 14px 34px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            flex: 1 0 auto;
            min-width: 100px;
            font-family: inherit;
        }
        .btn-primary {
            background: #1f4e8c;
            color: white;
            box-shadow: 0 6px 16px rgba(28, 78, 150, 0.20);
        }
        .btn-primary:hover:not(:disabled) {
            background: #15407a;
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #eaf1fa;
            border-color: #c9d8ec;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #dce6f2;
        }
        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .status-msg {
            font-size: 14px;
            color: #3f648a;
            padding: 8px 0 4px;
            text-align: center;
        }

        .complete-icon {
            font-size: 56px;
            text-align: center;
            margin: 12px 0 10px;
        }
        .result-summary {
            background: #f2f8ff;
            border-radius: 24px;
            padding: 22px 24px;
            margin: 18px 0 10px;
            border: 1px solid #d3e2f5;
        }
        .result-summary .big-score {
            font-size: 44px;
            font-weight: 700;
            color: #1f4e8c;
        }
        .result-summary .level-tag {
            font-weight: 700;
            font-size: 20px;
        }
        .result-summary .info-display {
            background: #edf4fc;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #1a3f60;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
        }
        .result-summary .info-display span {
            font-weight: 500;
        }

        .footnote {
            margin-top: 24px;
            font-size: 14px;
            color: #4a688a;
            background: #f6faff;
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid #dae6f5;
        }
        .footnote strong {
            color: #b13e3e;
        }

        /* 锁定提示横幅 */
        .lock-banner {
            background: #fef3e2;
            border: 2px solid #f0c27a;
            border-radius: 14px;
            padding: 14px 20px;
            margin-bottom: 20px;
            color: #8a6d3b;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .lock-banner .icon {
            font-size: 22px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 500px) {
            .card { padding: 28px 18px; }
            .q-text { font-size: 19px; }
            .options-grid label { min-width: 50px; padding: 12px 4px; font-size: 15px; }
            .btn { padding: 12px 20px; font-size: 15px; }
            .info-group { flex: 1 0 140px; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <div class="header">
        <span class="title">🧠 性格测评</span>
        <span class="badge" id="progressText">1 / 22</span>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
    </div>

    <!-- 动态内容区 -->
    <div id="dynamicContent"></div>

    <div class="footnote">
        <strong>⚠️ 重要提醒：</strong> 分数仅为筛查参考，<strong>高分不等于心理疾病</strong>，仅代表近期压力水平。
        提交后不可修改，请认真作答。
    </div>
</div>

<script>
    (function() {
        // ---------- 题目数据 ----------
        const dimensions = [
            {
                name: '情绪状态',
                questions: [
                    '容易感到心情低落、沮丧',
                    '容易烦躁、易怒，一点小事就情绪波动',
                    '感到焦虑、担忧，心里放不下事情',
                    '对以往感兴趣的事情提不起兴致',
                    '容易紧张、心慌，精神放松不下来'
                ]
            },
            {
                name: '工作压力',
                questions: [
                    '工作任务多，经常感觉超负荷',
                    '工作压力大，下班之后依旧无法摆脱工作思绪',
                    '对工作产生疲惫、倦怠感',
                    '感觉工作付出与回报不对等',
                    '面对工作挑战，容易产生无力感'
                ]
            },
            {
                name: '睡眠与躯体反应',
                questions: [
                    '入睡困难、多梦、容易早醒，睡眠质量差',
                    '容易疲惫，休息后也很难恢复精力',
                    '会出现莫名头疼、胸闷、肌肉紧绷等身体不适',
                    '食欲明显下降或者暴饮暴食'
                ]
            },
            {
                name: '人际与团队适配',
                questions: [
                    '和同事沟通协作感到吃力',
                    '不愿意与人交流，想要回避社交',
                    '能够获得同事、领导的理解与支持（反向）',
                    '遇到困难时，身边可以倾诉的人较少'
                ]
            },
            {
                name: '自我认知与职业心态',
                questions: [
                    '怀疑自己的工作能力，产生自我否定',
                    '对未来职业发展感到迷茫',
                    '能够找到工作中的成就感与价值感（反向）',
                    '相信自己可以应对工作中的各类问题（反向）'
                ]
            }
        ];

        const flatItems = [];
        dimensions.forEach((dim) => {
            dim.questions.forEach((q) => {
                flatItems.push({
                    text: q,
                    dimName: dim.name,
                    globalIndex: flatItems.length,
                    isReverse: false,
                });
            });
        });
        const reverseSet = new Set([16, 20, 21]);
        flatItems.forEach((item, idx) => {
            if (reverseSet.has(idx)) item.isReverse = true;
        });
        const TOTAL = flatItems.length;

        // ---------- localStorage 键名 ----------
        const STORAGE_KEY = 'psych_test_data';

        // ---------- 从 localStorage 加载数据 ----------
        function loadSavedData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const data = JSON.parse(raw);
                // 验证数据结构
                if (data && typeof data === 'object' && Array.isArray(data.answers) && data.answers.length === TOTAL) {
                    return data;
                }
                return null;
            } catch {
                return null;
            }
        }

        // ---------- 保存到 localStorage ----------
        function saveToStorage() {
            const data = {
                answers: answers,
                locked: locked,
                infoCompleted: infoCompleted,
                employeeInfo: employeeInfo,
                completedAt: new Date().toISOString()
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                // 忽略存储错误
            }
        }

        // ---------- 状态 ----------
        let answers = new Array(TOTAL).fill(null);
        let currentIndex = 0;
        let locked = false;

        let employeeInfo = {
            name: '',
            department: '',
            employeeId: '',
            phone: ''
        };
        let infoCompleted = false;

        // ---------- 尝试加载已保存数据 ----------
        const saved = loadSavedData();
        if (saved) {
            answers = saved.answers;
            locked = saved.locked || false;
            infoCompleted = saved.infoCompleted || false;
            employeeInfo = saved.employeeInfo || { name: '', department: '', employeeId: '', phone: '' };
        }

        const contentEl = document.getElementById('dynamicContent');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');

        // ---------- 工具函数 ----------
        function getScore() {
            let total = 0;
            let allFilled = true;
            for (let i = 0; i < TOTAL; i++) {
                const val = answers[i];
                if (val === null) {
                    allFilled = false;
                    continue;
                }
                let finalVal = val;
                if (flatItems[i].isReverse) {
                    finalVal = 6 - val;
                }
                total += finalVal;
            }
            return { total, allFilled };
        }

        function getLevel(total) {
            if (total >= 22 && total <= 44) return { level: '✅ 心理状态良好', desc: '情绪稳定，压力可控，适应较好；保持现有工作节奏即可。' };
            else if (total >= 45 && total <= 70) return { level: '🟡 轻度压力困扰', desc: '存在部分焦虑疲惫，属于职场常见状态；建议调整作息、做好时间管理，适当放松。' };
            else if (total >= 71 && total <= 90) return { level: '🟠 中度心理压力', desc: '压力情绪较为明显，睡眠、情绪受到影响；建议主动调节，可寻求同事或主管支持。' };
            else if (total >= 91 && total <= 110) return { level: '🔴 高风险状态', desc: '多项负面感受频繁出现，建议优先寻求专业心理咨询帮助，可适当调整工作负荷。' };
            else return { level: '—', desc: '请完成全部题目' };
        }

        function updateProgress() {
            if (locked) {
                progressText.textContent = `${TOTAL} / ${TOTAL}`;
                progressBar.style.width = '100%';
                return;
            }
            const shown = Math.min(currentIndex + 1, TOTAL);
            progressText.textContent = `${shown} / ${TOTAL}`;
            const pct = (currentIndex / TOTAL) * 100;
            progressBar.style.width = `${Math.min(pct, 100)}%`;
        }

        // ---------- 渲染：员工信息页 ----------
        function renderInfoPage() {
            // 如果已锁定，直接显示完成页
            if (locked) {
                renderCompletePage();
                return;
            }

            let html = `
                <div class="info-section">
                    <h3>📋 员工基本信息 <span>必填</span></h3>
                    <div class="info-row">
                        <div class="info-group">
                            <label>姓名 <span class="required">*</span></label>
                            <input type="text" id="infoName" placeholder="请输入您的姓名" value="${employeeInfo.name}">
                            <div class="info-error" id="nameError">请输入姓名</div>
                        </div>
                        <div class="info-group">
                            <label>部门 <span class="required">*</span></label>
                            <input type="text" id="infoDept" placeholder="请输入所在部门" value="${employeeInfo.department}">
                            <div class="info-error" id="deptError">请输入部门</div>
                        </div>
                        <div class="info-group">
                            <label>工号 <span class="required">*</span></label>
                            <input type="text" id="infoId" placeholder="请输入工号" value="${employeeInfo.employeeId}">
                            <div class="info-error" id="idError">请输入工号</div>
                        </div>
                        <div class="info-group">
                            <label>联系方式</label>
                            <input type="text" id="infoPhone" placeholder="手机号或邮箱（选填）" value="${employeeInfo.phone}">
                        </div>
                    </div>
                </div>
                <div style="text-align: center; margin: 10px 0 8px;">
                    <button class="btn btn-primary" id="startBtn" style="padding: 16px 50px; font-size: 18px;">开始测评 →</button>
                </div>
                <div style="text-align: center; font-size: 14px; color: #7a8fa5;">请先填写基本信息，再开始答题</div>
            `;

            contentEl.innerHTML = html;
            progressText.textContent = '📋 基本信息';
            progressBar.style.width = '0%';

            document.getElementById('startBtn').addEventListener('click', function() {
                if (validateInfo()) {
                    employeeInfo.name = document.getElementById('infoName').value.trim();
                    employeeInfo.department = document.getElementById('infoDept').value.trim();
                    employeeInfo.employeeId = document.getElementById('infoId').value.trim();
                    employeeInfo.phone = document.getElementById('infoPhone').value.trim();
                    infoCompleted = true;
                    currentIndex = 0;
                    saveToStorage();
                    renderQuestion();
                }
            });

            document.querySelectorAll('#infoName, #infoDept, #infoId, #infoPhone').forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        document.getElementById('startBtn').click();
                    }
                });
                input.addEventListener('input', function() {
                    const id = this.id;
                    const errorEl = document.getElementById(id.replace('info', '').toLowerCase() + 'Error');
                    if (errorEl) {
                        if (this.value.trim()) {
                            errorEl.style.display = 'none';
                            this.style.borderColor = '#d5e0ed';
                        }
                    }
                });
            });
        }

        function validateInfo() {
            let valid = true;
            const name = document.getElementById('infoName').value.trim();
            const dept = document.getElementById('infoDept').value.trim();
            const empId = document.getElementById('infoId').value.trim();

            const nameError = document.getElementById('nameError');
            const deptError = document.getElementById('deptError');
            const idError = document.getElementById('idError');

            if (!name) {
                nameError.style.display = 'block';
                document.getElementById('infoName').style.borderColor = '#c0392b';
                valid = false;
            } else {
                nameError.style.display = 'none';
            }

            if (!dept) {
                deptError.style.display = 'block';
                document.getElementById('infoDept').style.borderColor = '#c0392b';
                valid = false;
            } else {
                deptError.style.display = 'none';
            }

            if (!empId) {
                idError.style.display = 'block';
                document.getElementById('infoId').style.borderColor = '#c0392b';
                valid = false;
            } else {
                idError.style.display = 'none';
            }

            if (!valid) {
                alert('请填写所有必填项（姓名、部门、工号）');
            }
            return valid;
        }

        // ---------- 渲染题目 ----------
        function renderQuestion() {
            if (locked) {
                renderCompletePage();
                return;
            }

            if (!infoCompleted) {
                renderInfoPage();
                return;
            }

            // 检查是否所有题目都已答完（已全部完成但未锁定）
            const allAnswered = answers.every(a => a !== null);
            if (allAnswered && currentIndex >= TOTAL - 1) {
                // 全部答完，自动进入完成页（但保留提交按钮）
                // 但这里继续显示最后一题，让用户点击提交
            }

            if (currentIndex >= TOTAL) {
                // 如果索引超出，重置到最后一题
                currentIndex = TOTAL - 1;
            }

            const item = flatItems[currentIndex];
            const idx = currentIndex;
            const selectedVal = answers[idx];

            let html = `<div class="question-area">`;
            html += `<div class="q-number">第 ${idx+1} 题 / ${TOTAL} 题 · ${item.dimName}</div>`;
            html += `<div class="q-text">${item.text}`;
            if (item.isReverse) {
                html += `<span class="reverse-tag">反向</span>`;
            }
            html += `</div>`;

            html += `<div class="options-grid" id="optionsGrid">`;
            const labels = ['完全没有', '偶尔', '有时', '经常', '总是'];
            for (let v = 1; v <= 5; v++) {
                const checked = (selectedVal === v) ? 'checked' : '';
                html += `<label>
                            <input type="radio" name="q" value="${v}" ${checked}>
                            <span>${v}</span>
                            <span class="sub">${labels[v-1]}</span>
                         </label>`;
            }
            html += `</div>`;

            html += `<div class="action-row">`;
            if (idx > 0) {
                html += `<button class="btn btn-secondary" id="prevBtn">← 上一题</button>`;
            } else {
                html += `<div></div>`;
            }

            if (idx === TOTAL - 1) {
                const allFilled = answers.every(a => a !== null);
                html += `<button class="btn btn-primary" id="submitBtn" ${!allFilled ? 'disabled' : ''}>📩 提交测评 · 锁定</button>`;
            } else {
                const hasAnswer = answers[idx] !== null;
                html += `<button class="btn btn-primary" id="nextBtn" ${!hasAnswer ? 'disabled' : ''}>下一题 →</button>`;
            }
            html += `</div>`;

            if (selectedVal !== null) {
                html += `<div class="status-msg" style="color:#1f6b3a;">✅ 已选择：${labels[selectedVal-1]}</div>`;
            } else {
                html += `<div class="status-msg" style="color:#8f6b3a;">请选择一个选项</div>`;
            }

            contentEl.innerHTML = html;
            bindEvents(idx);
            updateProgress();
        }

        // ---------- 绑定事件 ----------
        function bindEvents(idx) {
            const radios = document.querySelectorAll('input[name="q"]');
            radios.forEach(radio => {
                radio.addEventListener('change', function(e) {
                    if (locked) return;
                    const val = parseInt(this.value, 10);
                    answers[idx] = val;
                    saveToStorage();
                    renderQuestion();
                });
            });

            const prevBtn = document.getElementById('prevBtn');
            if (prevBtn) {
                prevBtn.addEventListener('click', function() {
                    if (locked) return;
                    if (currentIndex > 0) {
                        currentIndex--;
                        renderQuestion();
                    }
                });
            }

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    if (locked) return;
                    if (answers[idx] === null) {
                        alert('请先选择当前题目的答案');
                        return;
                    }
                    if (currentIndex < TOTAL - 1) {
                        currentIndex++;
                        renderQuestion();
                    }
                });
            }

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.addEventListener('click', function() {
                    if (locked) return;
                    const { allFilled } = getScore();
                    if (!allFilled) {
                        alert('还有题目未作答，请完成全部题目。');
                        return;
                    }
                    // 锁定
                    locked = true;
                    saveToStorage();
                    renderCompletePage();
                });
            }
        }

        // ---------- 完成页（无重置按钮） ----------
        function renderCompletePage() {
            const { total, allFilled } = getScore();
            const info = getLevel(total);
            locked = true;

            let html = `
                <div class="lock-banner">
                    <span class="icon">🔒</span>
                    测评已提交，答案已锁定，不可修改
                </div>
            `;

            html += `<div class="complete-icon">📋</div>`;
            html += `<h3 style="text-align:center; font-size:22px; margin-bottom:4px;">测评已完成</h3>`;
            html += `<p style="text-align:center; color:#3a5f7a; font-size:15px;">感谢您的参与！</p>`;

            // 显示员工信息
            html += `<div class="result-summary">
                        <div class="info-display">
                            <span>👤 姓名：${employeeInfo.name || '未填写'}</span>
                            <span>🏢 部门：${employeeInfo.department || '未填写'}</span>
                            <span>🆔 工号：${employeeInfo.employeeId || '未填写'}</span>
                            ${employeeInfo.phone ? `<span>📞 ${employeeInfo.phone}</span>` : ''}
                        </div>`;

            if (allFilled) {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                            <span style="font-size:18px; font-weight:500;">总分</span>
                            <span class="big-score">${total} <span style="font-size:20px; font-weight:400; color:#3a5f7a;">/ 110</span></span>
                         </div>
                         <div style="margin-top:14px;">
                            <div class="level-tag">${info.level}</div>
                            <div style="margin-top:6px; color:#1f3f60;">${info.desc}</div>
                         </div>`;
            } else {
                html += `<div style="background:#fcf2e8; border-radius:20px; padding:20px; text-align:center; border:1px solid #f0d5b8;">
                            <span style="font-size:20px;">⚠️</span> 部分题目未作答，无法计算总分。
                         </div>`;
            }
            html += `</div>`;

            // 答题回顾
            html += `<div style="margin-top:18px; background:#f8faff; border-radius:18px; padding:14px 16px; border:1px solid #dae6f5; max-height:200px; overflow-y:auto;">`;
            html += `<div style="font-weight:600; font-size:14px; color:#1f3f60; margin-bottom:8px;">📌 答题回顾</div>`;
            const labelMap = ['完全没有', '偶尔', '有时', '经常', '总是'];
            flatItems.forEach((item, i) => {
                const val = answers[i];
                const display = val !== null ? `${val} - ${labelMap[val-1]}` : '未作答';
                const revMark = item.isReverse ? ' (反向)' : '';
                html += `<div style="display:flex; justify-content:space-between; font-size:14px; padding:4px 0; border-bottom:1px dashed #e3edf8;">
                            <span style="color:#1d3a5a;">${i+1}. ${item.text}${revMark}</span>
                            <span style="font-weight:500; color:#1f4e8c;">${display}</span>
                         </div>`;
            });
            html += `</div>`;

            // ⚠️ 注意：这里没有重置按钮！用户无法重新测评

            contentEl.innerHTML = html;
            progressText.textContent = `${TOTAL} / ${TOTAL}`;
            progressBar.style.width = `100%`;
        }

        // ---------- 初始化 ----------
        function init() {
            if (locked) {
                // 如果已锁定，直接显示完成页
                renderCompletePage();
                return;
            }

            if (infoCompleted) {
                // 已填写信息但未锁定，跳转到当前题目
                // 找到第一个未答的题目，或最后一题
                let firstUnanswered = answers.findIndex(a => a === null);
                if (firstUnanswered === -1) {
                    // 全部已答，跳转到最后一题
                    currentIndex = TOTAL - 1;
                } else {
                    currentIndex = firstUnanswered;
                }
                renderQuestion();
            } else {
                renderInfoPage();
            }
        }

        init();
    })();
</script>
</body>
</html>
